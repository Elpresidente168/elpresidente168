utir seguridad. El tema quema. Si vas duro con mano dura, subís con votante mayor. Si vas garantista, te bancan las redes pero te matan en TV.",choices:[{title:"Mano dura, cárceles y LUC",desc:"Discurso Cabildo-friendly",effects:{popularidad:10,seguridad:5,prestigio:-5,sindicatos:-6},headline:"Pide más mano dura",tags:["populista","seguridad"]},{title:"Enfoque rehabilitación + datos",desc:"Citás cifras de Noruega",effects:{prestigio:10,prensa:6,popularidad:-4},headline:"Propuesta nórdica para cárceles",tags:["prestigio"]},{title:"Atacar al rival en vivo",desc:"Clip viral asegurado",effects:{popularidad:12,prensa:8,reputacion:-8,escandalos:5},headline:"Cruce feroz en TV",tags:["viral","riesgo"]}]},{age:32,id:"e32",type:"story",meta:"PARTIDO • INTERNA",title:"La lista al Parlamento se define a cuchillo",context:"Congreso en Durazno. Asado, vino, y traiciones.",text:"Tenés que negociar tu lugar en lista a Diputados por Montevideo. Hay 3 facciones. La oficialista te pide que bajes tu perfil en redes a cambio de lugar 4. La disidente te ofrece lugar 2 pero es suicidio si pierden.",choices:[{title:"Con oficialismo, perfil bajo",desc:"Seguro pero opaco",effects:{apoyo:12,org:8,popularidad:-4,estabilidad:5},headline:"Acuerdo de cúpulas",tags:["aparato"]},{title:"Con disidencia, a todo o nada",desc:"Si ganan, sos diputado seguro",effects:{popularidad:10,influencia:-5,estabilidad:-8,experiencia:6},headline:"Rebelión en la interna",tags:["populista","riesgo"]},{title:"Lista propia joven",desc:"Peligrosa pero te posiciona",effects:{prestigio:8,prensa:8,recursos:-8,apoyo:-5},headline:"Lista joven irrumpe",tags:["prestigio","renovador"]}]},{age:34,id:"e34",type:"story",meta:"DIPUTADO • PRIMER AÑO",title:"Proyecto de ley polémico",context:"Comisión de Hacienda. Empresarios en la puerta.",text:"Te toca informar una reforma de impuestos al patrimonio. Tu partido quiere subir 1 punto. Los empresarios te amenazan con sacar pauta y financiar a tu rival.",choices:[{title:"Votar a favor ad, pero también trajiste 2000 empleos. Tenés 2 minutos.",choices:[{title:"Defender UPM con empleo",desc:"Datos de empleo",effects:{empresarios:8,prestigio:5,popularidad:-4,sindicatos:4},headline:"Defiende inversión extranjera",tags:["tecnico"]},{title:'Atacar: "Vos nunca laburaste"',desc:"Golpe bajo efectivo",effects:{popularidad:12,prensa:6,reputacion:-10,escandalos:4},headline:"Debate subido de tono",tags:["viral"]},{title:"Propuesta superadora: Fondo del interior",desc:"Sacar tema de agenda",effects:{rural:10,prestigio:8,popularidad:5},headline:"Propone fondo para interior",tags:["prestigio"]}]},{age:50,id:"e50",type:"election",electionType:"president",meta:"ELECCIÓN • PRESIDENCIA",title:"La elección presidencial",context:"Balotaje obligatorio. 45% para ganar en primera.",text:"Tenés 50. La elección presidencial. Tu fórmula contra todo el sistema. Si llegás a 45% ganás en primera. Si no, balotaje. Todo lo que hiciste te trajo hasta acá.",choices:[{title:"Campaña épica, 19 departamentos otra vez",desc:"Cierre en Antel Arena",effects:{popularidad:16,recursos:-15,estabilidad:-6},headline:"Cierre multitudinario",tags:["populista","campaña"]},{title:"Campaña de centro, acuerdo con independientes",desc:"Buscar balotaje",effects:{prestigio:10,prensa:8,popularidad:6,sindicatos:4},headline:"Giro al centro",tags:["prestigio"]},{title:"Campaña de aparato, estructura pura",desc:"Cada comité una fortaleza",effects:{influencia:14,org:12,popularidad:4,recursos:6},headline:"Aparato a full",tags:["aparato"]}]},{age:52,id:"e52",type:"story",meta:"PRESIDENTE O SENADOR",title:"Primer año de gobierno / oposición",context:"Torre Ejecutiva o banca de oposición. Dos mundos.",text:"Si sos presidente, tenés 40% de aprobación y paros. Si sos senador opositor, tenés tribuna para pegarle al gobierno. En ambos casos, te piden reforma de seguridad social.",choices:[{title:"Impulsar reforma dura",desc:"Subir edad jubilatoria",effects:{prestigio:8,economia:6,popularidad:-12,sindicatos:-10},head
