ajo, ganás confianza.",effects:{estabilidad:8,reputacion:5,popularidad:2},headline:"El perfil bajo que crece en {sub}"}]},{id:"inundacion",act:1,title:"Inundación en el barrio",context:'"El arroyo se desbordó otra vez, no da para más"',text:(e)=>`Llovió 120mm en ${e}. Hay 12 familias evacuadas, la policlínica sin luz y la intendencia no atiende. Te llegan 3 mensajes: un vecino pide que vayas, tu agrupación quiere una foto para redes, y tu vieja te dice que no te metas. ¿Qué hacés?`,choices:[{title:"Ir a ayudar sin foto",desc:"Cargás bolsas, embarrado hasta la rodilla.",effects:{popularidad:9,reputacion:8,estabilidad:-4},headline:"En {sub} los vecinos rescatan a los vecinos"},{title:"Video denuncia + pedido",desc:"Te filmás con agua a las rodillas y etiquetás a todos.",effects:{popularidad:7,prestigio:3,escandalos:3},headline:"Fuerte denuncia de militante de {sub} se viraliza"},{title:"Gestionar colchones",desc:"Llamás al Mides, a un edil amigo, conseguís 20 colchones.",effects:{recursos:10,prestigio:6,reputacion:6},headline:"Aparecieron colchones en {sub}: la rosca que funcionó"}]},{id:"peaje",act:1,title:"El peaje de la Ruta 5",origins:["interior"],context:"Pasar por el peaje ya es parte del sueldo.",text:(e)=>`Venís de ${e} a Montevideo todas las semanas. 4 peajes ida y vuelta. Un productor te dice: "Si seguimos así me sale más barato mandar las vacas en Uber". En el comité te piden postura para un comunicado. El FA quiere sacarlo, los blancos bajarlo, colorados revisarlo.`,choices:[{title:"Pedir eliminación total",desc:"Populista pero pega fuerte en el interior.",effects:{popularidad:10,reputacion:-5,recursos:-5},headline:"Polémica: joven de {sub} pide volar peajes"},{title:"Proponer tarifa diferencial",desc:"Equilibrio técnico, aburrido pero sólido.",effects:{prestigio:7,reputacion:7,popularidad:2},headline:"Propuesta técnica desde {sub} sorprende"},{title:"Silencio estratégico",desc:"No te peleás con nadie.",effects:{estabilidad:6,reputacion:2},headline:"En {sub} miden cada palabra"}]},{id:"asado",act:1,title:"Asado con vecinos",context:"El asado es la verdadera interna.",text:(e)=>`Te invitan a un asado en ${e}. Hay chori, vacío, y un tío que votó a todos los partidos desde 1984. Te pregunta a quemarropa: "¿Y ustedes cuándo van a arreglar esto?". Todos te miran. El fuego crepita. Es tu momento Búsqueda.`,choices:[{title:"Prometer poco",desc:'"No prometo asado todos los domingos, pero..."',effects:{reputacion:9,popularidad:4,estabilidad:3},headline:"El que no promete en {sub}"},{title:"Chicana partidaria",desc:'Tirás un "cuando ustedes estaban..."',effects:{popularidad:5,escandalos:6,reputacion:-3},headline:"Chicana en asado de {sub} termina en debate"},{title:"Escuchar y anotar",desc:"Sacás el cuaderno de verdad.",effects:{prestigio:5,popularidad:6,estabilidad:5},headline:"El militante que anota: fenómeno en {sub}"}]},{id:"tweet",act:1,title:"Tweet que se va al pasto",context:"Un tuit a las 23:47 nunca salió bien.",text:()=>'Pusiste: "Si seguimos así nos gobierna Conaprole". Tiene 4 likes de tu barra. Te despertás y tiene 1.2k RT, te levantó El Observador y un diputado te citó. Te tiembla el celular.',choices:[{title:"Borrar y pedir disculpas",desc:"Te comés la pastilla.",effects:{escandalos:-5,reputacion:-4,estabilidad:5},headline:"Borra tuit y pide disculpas: marcha atrás"},{title:"Redoblar",desc:"Hilo de 12 tuits explicando la lechería.",effects:{prestigio:8,popularidad:6,escandalos:8},headline:"Se hace viral por hilo lechero"},{title:"Hacerte el distraído",desc:"Dejás que se apague solo.",effects:{estabilidad:-3,escandalos:5},headline:"Polémico tuit sigue generando ruido"}]},{id:"pasantia",act:1,title:"Pasantía en la Junta",origins:["mvd"],context:'"Te pagan 15 mil pero aprendés rosca"',text:(e)=>`Te ofrecen pasantía en la Junta de Montevideo por el edil de ${e}. Son 6 meses archivando expedientes de luminarias que nunca se colocaron. Pero ves todo: quién transa, quién labura, quién duerme.`,choices:[{title:"Hacerte notar",desc:"Proponés digitalizar todo.",effects:{prestigio:7,reputacion:5,recursos:-2},headline:"Joven de {sub} quiere modernizar la Junta"},{title:"Aprender en silencio",desc:"Mirás, anotás, no jodés.",effects:{estabilidad:7,prestigio:4,reputacion:3},headline:"Perfil bajo en Junta: el que observa"},{title:"Filtrar un expediente",desc:"Ves sobreprecios y dudás.",effects:{escandalos:15,popularidad:8,reputacion:6,estabilidad:-10},headline:"Filtración en Junta: escándalo en puerta"}]},{id:"feria",act:1,title:"Tristán Narvaja a las 7am",origins:["mvd"],context:"Donde el país se encuentra los domingos.",text:()=>'Vas a volantear a Tristán. Un feriante te dice: "Mijo, yo voto al que me baje el BPS". Una señora te pide que le sostengas un espejo mientras se prueba lentes. Entendés Uruguay en 20 minutos.',choices:[{title:"Charlar con feriantes",desc:"Sin volante, mano a mano.",effects:{popularidad:8,estabilidad:4},headline:"Militancia a pie en Tristán Narvaja"},{title:"Discutir con libertario",desc:"Hay uno con parlante gritando.",effects:{escandalos:4,popularidad:3,prestigio:-2},headline:"Cruce en feria termina en video"},{title:"Comprar y repartir tortas fritas",desc:"Gastás, pero ganás.",effects:{popularidad:6,recursos:-8,reputacion:4},headline:"Tortas fritas y política: combo que funciona"}]},{id:"ute",act:1,title:"Corte de UTE de 8 horas",context:"UTE te avisa por SMS que te va a cortar. Gracias.",text:(e)=>`En ${e} cortan la luz de 9 a 17 por mantenimiento. No hay agua, no hay wifi, el almacén no cobra con débito. La gente está podrida. Tu comité te pide que hagas algo.`,choices:[{title:"Olla comunitaria",desc:"Prendés fuego en la calle y cocinás.",effects:{popularidad:9,reputacion:7,estabilidad:-2},headline:"Vecinos de {sub} cocinan en la calle por corte de UTE"},{title:"Reclamo formal",desc:"Carta a UTE con 200 firmas.",effects:{prestigio:6,reputacion:5},headline:"Reclamo formal por cortes en {sub}"},{title:"Puteada en Telemundo",desc:"Te llaman y prendés fuego.",effects:{popularidad:7,escandalos:6},headline:"Vecino de {sub} estalla en TV"}]},{id:"mate",act:1,title:"El mate del comité",context:"El mate dice todo: si está lavado, si quema, si es amargo.",text:(e)=>`En el comité de ${e} hay pique: los viejos toman amargo, los jóvenes quieren con yuyos y azúcar. Parece boludez pero es la grieta generacional. Te piden que laudes.`,choices:[{title:"Amargo y punto",desc:"Tradición.",effects:{reputacion:4,estabilidad:-2,popularidad:3},headline:"Polémica del mate en {sub}"},{title:"Dos termos",desc:"Solución salomónica.",effects:{estabilidad:8,reputacion:6,prestigio:2},headline:"Acuerdo histórico por el mate en {sub}"},{title:"Traer facturas",desc:"Desvías el tema.",effects:{popularidad:5,recursos:-3,estabilidad:4},headline:"Facturas frenan grieta del mate"}]},{id:"8m",act:1,title:"8M en 18 de Julio",context:"La calle es de todos, pero tenés que decidir dónde pararte.",text:()=>"Es 8 de marzo. Marcha enorme por 18. Tu partido no se pone de acuerdo si ir con bandera o no. Vos qué hacés?",choices:[{title:"Ir sin bandera partidaria",desc:"Respeto total.",effects:{reputacion:8,popularidad:5,prestigio:3},headline:"Militante va sin bandera al 8M"},{title:"Ir con columna",desc:"Partido presente.",effects:{popularidad:4,estabilidad:3,escandalos:2},headline:"Columna partidaria en 8M genera debate"},{title:"Quedarte organizando",desc:"Armás logística atrás.",effects:{prestigio:6,estabilidad:6},headline:"El laburo invisible del 8M"}]},{id:"clasico",act:1,title:"Clásico en el barrio",context:"Peñarol-Nacional paraliza hasta el comité.",text:(e)=>`Domingo 16:30, clásico. En ${e} no se habla de otra cosa. Tu candidato te pide que hagas un acto a la misma hora. ¿Estás loco?`,choices:[{title:"Mover el acto",desc:"Sentido común.",effects:{popularidad:6,estabilidad:5},headline:"Acto movido por clásico: sensatez en {sub}"},{title:"Hacerlo igual + pantalla",desc:"Ponés el partido de fondo.",effects:{popularidad:3,recursos:-4,reputacion:2},headline:"Política y clásico: combo en {sub}"},{title:"Suspender y mirar juntos",desc:"Choripán y debate en entretiempo.",effects:{popularidad:8,reputacion:4},headline:"Asado y clásico: la táctica de {sub}"}]},{id:"nota",act:1,title:"Primera nota en prensa",context:"Te llamó un periodista de Montevideo Portal. Respirá.",text:()=>"Te piden una columna de 400 palabras. Tema libre. Si la pegás, te leen 20 mil personas. Si la errás, te escrachan en Twitter.",choices:[{title:"Escribir sobre tu barrio",desc:"Concreto y honesto.",effects:{reputacion:7,popularidad:5,prestigio:4},headline:"Columna de joven militante destaca"},{title:"Tirar una bomba",desc:"Denunciás algo gordo sin pruebas firmes.",effects:{escandalos:12,popularidad:7,prestigio:-3},headline:"Polémica columna genera revuelo"},{title:"Pedir ayuda a veterano",desc:"Te corrige un histórico.",effects:{prestigio:5,estabilidad:5,reputacion:4},headline:"Columna con guiño veterano"}]},{id:"pozo",act:1,title:"El pozo de 8 meses",context:"Hay un pozo que ya tiene nombre propio.",text:(e)=>`En ${e} hay un pozo que rompió 14 autos. La intendencia dice que es de OSE, OSE que es de la intendencia. Te proponen encadenarte al pozo para la foto.`,choices:[{title:"Encadenarte",desc:"Foto épica, rodilla embarrada.",effects:{popularidad:9,escandalos:4,reputacion:2},headline:"Se encadena a pozo en {sub}"},{title:"Gestionar arreglo real",desc:"Llamás 40 veces hasta que viene cuadrilla.",effects:{reputacion:9,prestigio:6,estabilidad:-2},headline:"Tras 8 meses, tapan pozo en {sub}"},{title:"Meme del pozo",desc:"Hacés cuenta de Instagram del pozo.",effects:{popularidad:7,prestigio:3,escandalos:2},headline:"El pozo de {sub} es influencer"}]},{id:"jovenes",act:1,title:"Agrupación de jóvenes",context:"Los jóvenes no son el futuro, son el quilombo presente.",text:()=>'Te toca armar la juventud del partido. Llegan 15 pibes de 19 años que militan por TikTok y te dicen "ok boomer" aunque tenés 26. Tenés que retenerlos.',choices:[{title:"Dejarlos hacer TikToks",desc:"Cringen pero funciona.",effects:{popularidad:8,prestigio:-2,recursos:3},headline:"Agrupación joven la rompe en TikTok"},{title:"Formación política dura",desc:"Libros, historia, debate.",effects:{reputacion:8,prestigio:7,popularidad:-3},headline:"Vuelve la formación política"},{title:"Fútbol 5 + política",desc:"Juntás jugando.",effects:{estabilidad:6,popularidad:6},headline:"Fútbol y militancia: fórmula"}]},{id:"olla",act:1,title:"Olla popular en invierno",context:"Julio, 4 grados, y la olla no para.",text:(e)=>`En ${e} se armó olla popular. Van 80 personas por noche. Te piden que consigas donaciones y que no saques rédito político. Pero tu jefe quiere la foto.`,choices:[{title:"Ir sin cartel",desc:"Sin bandera, a laburar.",effects:{reputacion:10,popularidad:6,estabilidad:3},headline:"Olla en {sub} sin banderas"},{title:"Foto discreta",desc:"Una foto al final, lavando ollas.",effects:{popularidad:7,reputacion:3,escandalos:2},headline:"Dirigente en olla de {sub}"},{title:"Conseguir todo",desc:"Movés cielo y tierra.",effects:{prestigio:8,recursos:-6,popularidad:8},headline:"Consigue 200kg de comida para {sub}"}]},{id:"candombe",act:1,title:"Llamadas en el Cerro",origins:["mvd"],context:"El tambor no se discute, se siente.",text:()=>"Te invitan a las Llamadas. Tu partido quiere sacar comunicado por patrimonio. Vos estás con el chico del repique que te explica que no quieren políticos en la foto.",choices:[{title:"Ir como vecino",desc:"Sin remera partidaria.",effects:{reputacion:7,popularidad:6},headline:"Político va a Llamadas sin bandera"},{title:"Subir comunicado igual",desc:"Quedás bien con el partido.",effects:{estabilidad:5,reputacion:-2,popularidad:2},headline:"Comunicado por Llamadas genera ruido"},{title:"Proponer ley de apoyo",desc:"Plata concreta para comparsas.",effects:{prestigio:7,recursos:-5,popularidad:5},headline:"Propone fondo para Llamadas"}]},{id:"vereda",act:1,title:"Campaña puerta a puerta",context:'Timbre, perro, y "ya voté, gracias".', une nada.",text:(e)=>`La ruta 8 a la altura de ${e} está intransitable. Un camionero sube video puteando. Te etiquetan 200 veces. El ministro es de tu partido y te dice "bancame 6 meses".`,choices:[{title:"Bancar al ministro",desc:"Lealtad.",effects:{estabilidad:7,recursos:5,reputacion:-4},headline:"Banca a ministro por ruta 8"},{title:"Denuncia pública",desc:"Video en la ruta.",effects:{popularidad:10,escandalos:5,reputacion:6,estabilidad:-5},headline:"Fuerte denuncia por ruta 8 en {sub}"},{title:"Conseguir bacheo provisorio",desc:"Algo es algo.",effects:{popularidad:6,prestigio:5},headline:"Consigue bacheo en ruta 8"}]},{id:"soja",act:2,title:"Precio de la soja se desploma",origins:["interior"],context:"Cuando la soja estornuda, el interior se engripa.",text:(e)=>`La soja cae 30%. En ${e} hay productores que no levantan cosecha. Te piden que pidas emergencia agropecuaria. Tu partido en Montevideo no quiere gastar.`,choices:[{title:"Pedir emergencia ya",desc:"Con productores en plaza.",effects:{popularidad:11,reputacion:4,recursos:-8,estabilidad:-4},headline:"Pide emergencia agropecuaria desde {sub}"},{title:"Propuesta intermedia",desc:"Créditos blandos.",effects:{prestigio:7,reputacion:6,estabilidad:3},headline:"Propone créditos para {sub}"},{title:"Alineado con Montevideo",desc:"Te cuesta pero bancás.",effects:{estabilidad:8,popularidad:-7},headline:"Distancia con productores de {sub}"}]},{id:"antel-arena",act:2,title:"Antel Arena y tu voto",context:"Antel Arena: el tema que nunca muere.",text:()=>'Se discute si investigar sobrecostos del Antel Arena. Vos no tenías nada que ver, pero te toca votar. Tu vieja te dice "no te metas en esa".',choices:[{title:"Votar investigar",desc:"Caiga quien caiga.",effects:{reputacion:9,escandalos:4,estabilidad:-4},headline:"Vota investigar Antel Arena"},{title:"Abstenerte",desc:"Perfil bajo.",effects:{estabilidad:4,reputacion:-2},headline:"Abstención por Antel Arena"},{title:"Votar en contra",desc:"Defendés gestión pasada.",effec :-6},headline:'Rechaza padrino: "Voy solo"'},{title:"Negociar autonomía",desc:"Aceptás a medias.",effects:{prestigio:5,estabilidad:4,reputacion:2},headline:"Acuerdo con histórico: autonomía pactada"}]},{id:"ley-medios",act:2,title:"Ley de medios",context:"Todos hablan de libertad de prensa hasta que les toca.",text:()=>"Se vota ley de medios. Tu partido a favor, pero vos tenés amigos periodistas que te dicen que es mordaza. Te aprietan de los dos lados.",choices:[{title:"Votar con el partido",desc:"Disciplina.",effects:{estabilidad:8,reputacion:-4,prestigio:2},headline:"Vota ley de medios con su partido"},{title:"Votar en contra",desc:"Ruptura.",effects:{reputacion:10,popularidad:5,estabilidad:-10,escandalos:5},headline:"Voto rebelde en ley de medios"},{title:"Proponer cambios",desc:"Artículo por artículo.",effects:{prestigio:8,reputacion:6},headline:"Propone cambios a ley de medios"}]},{id:"estancia",act:2,title:"Asado en estancia de 2000 há",origins:["interior"],context:"El asado donde se cocina el país.",text:(e)=>`Te invitan a estancia cerca de ${e}. Hay 3 senadores, 2 empresarios y un asador que no habla. Te preguntan si vas a subir impuestos al agro.`,choices:[{title:"Decir que no",desc:"Tranquilizás.",effects:{recursos:10,estabilidad:6,reputacion:-3},headline:"Promete no subir impuestos al agro en {sub}"},{title:"Decir que sí, con matices",desc:"Progresivo.",effects:{reputacion:7,popularidad:4,recursos:-6,escandalos:4},headline:"Polémica por impuestos al agro"},{title:"Esquivar",desc:"Hablás del clima.",effects:{estabilidad:3,prestigio:-2},headline:"Evita definir impuestos en estancia"}]},{id:"interior-gira",act:2,title:"Gira por el interior profundo",origins:["mvd"],context:"Si sos de Montevideo, el interior empieza en el peaje.",text:()=>'Te llevan de gira: 4 departamentos en 2 días. Polvo, ruta, y gente que te dice "ustedes los de Montevideo...". Tenés que conectar.',choices:[{title:"Quedarte 2 días más",desc:"Dormís en lo de un militante.",effects:{popula ara comprar cosas para la campaña.",choices:[{title:"Misión austera",desc:"Todo rendido, hotel 3 estrellas.",effects:{reputacion:9,prestigio:5,recursos:-3},headline:"Misión austera a Brasil"},{title:"Traer acuerdos",desc:"Volvés con inversiones.",effects:{prestigio:10,popularidad:6,recursos:6},headline:"Anuncia inversiones tras viaje a Brasil"},{title:"Turismo + rosca",desc:"Un poco y un poco.",effects:{escandalos:7,estabilidad:-2,popularidad:2},headline:"Viaje a Brasil en la mira"}]},{id:"lechera",act:3,title:"Crisis lechera",context:"Conaprole no es joda.",text:(e)=>`Crisis lechera en ${e}. Tamberos cortan ruta. Te piden que medies entre gobierno y productores. Si fallás, te odian todos.`,choices:[{title:"Mediar de verdad",desc:"48hs sin dormir.",effects:{reputacion:12,prestigio:10,estabilidad:-5,popularidad:7},headline:"Mediación por crisis lechera en {sub}"},{title:"Foto y chau",desc:"Vas, foto, te vas.",effects:{popularidad:3,reputacion:-4,escandalos:2},headline:"Visita relámpago a tamberos de {sub}"},{title:"Culpar al gobierno",desc:"Rédito fácil.",effects:{popularidad:8,escandalos:5,estabilidad:-3},headline:"Dura crítica por crisis lechera"}]},{id:"juicio",act:3,title:"Juicio político a un ministro",context:"Juicio político: el show que a todos les gusta mirar.",text:()=>"Tu partido pide juicio político a ministro rival. No tienen los votos pero quieren el show. Te toca ser miembro informante. ¿Qué hacés?",choices:[{title:"Ir a fondo",desc:"Show total, prime time.",effects:{popularidad:7,escandalos:8,prestigio:4,estabilidad:-4},headline:"Duro alegato en juicio político"},{title:"Técnico y sobrio",desc:"Sin gritos.",effects:{reputacion:9,prestigio:7,popularidad:2},headline:"Alegato técnico en juicio"},{title:"Faltar",desc:"Te borrás.",effects:{estabilidad:4,reputacion:-5},headline:"Ausencia en juicio político"}]},{id:"narco",act:3,title:"Boca en tu barrio",context:"El tema que nadie quiere tocar.",text:(e)=>`En ${e} denuncian que hay una boca que opera hace me ondos sin ejecutar en {sub}"}]},{id:"debate-pres",act:3,title:"Debate presidencial en Canal 4",context:"4 millones mirando. O 400 mil, pero parece mucho.",text:()=>'Debate presidencial. Tenés 1 minuto para decir por qué vos. Tu rival te mira fijo. Tu madre te mandó "no te olvides de tomar agua".',choices:[{title:"Propuesta concreta",desc:"3 medidas con números.",effects:{prestigio:10,reputacion:8,popularidad:5},headline:"Propuesta concreta en debate"},{title:"Golpe bajo",desc:"Sacás un carpetazo.",effects:{popularidad:6,escandalos:12,reputacion:-6},headline:"Golpe bajo en debate presidencial"},{title:"Emoción",desc:"Hablás de tu vieja, de tu barrio.",effects:{popularidad:12,reputacion:5},headline:"Momento emotivo en debate"}]},{id:"lluvia",act:3,title:"Inundación grande, otra vez",context:"Cada 5 años Uruguay se inunda y nos sorprendemos.",text:(e)=>`Inundación histórica en ${e}. Evacuados, rutas cortadas. El presidente te pide que vayas porque sos de ahí. Tenés que estar 3 días sin dormir.`,choices:[{title:"Ir y quedarte",desc:"Barro, sin prensa.",effects:{reputacion:12,popularidad:9,estabilidad:-6},headline:"Se queda 3 días en inundación de {sub}"},{title:"Ir con comitiva",desc:"Con casco y bota nueva.",effects:{popularidad:5,escandalos:4},headline:"Visita con comitiva a {sub}"},{title:"Mandar a otro",desc:"Tenés gripe.",effects:{popularidad:-6,estabilidad:2},headline:"Ausencia criticada en inundación"}]},{id:"auditoria",act:3,title:"Auditoría te cae",context:"La Jutep no perdona. Bueno, a veces sí.",text:()=>'Te cae auditoría por viáticos de 2029. Tenés 3 facturas truchas de un asado que pasaste como "reunión de trabajo". Son 8000 pesos, pero si sale en prensa te mata.',choices:[{title:"Devolver y admitir",desc:"Error, devuelvo.",effects:{reputacion:8,escandalos:-6,popularidad:2,recursos:-2},headline:'Devuelve viáticos: "Fue un error"'},{title:"Pelearla",desc:"Decís que fue reunión.",effects:{escandalos:10,estabilidad:-4,reputacion:-5},headline:"Polémica por viát
