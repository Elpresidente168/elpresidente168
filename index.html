,tags:["prestigio","estudio"]}]},{age:26,id:"e26",type:"story",meta:"EDIL / OPOSICIÓN",title:"Coimas en la intendencia",context:'Una empresa de recolección quiere tu voto en la Junta. Te ofrece "aporte".',text:"Estás en la Junta. Te llega un sobre con un empresario. 20 mil dólares para votar una licitación trucha. Si lo aceptás, financiás tu próxima campaña. Si lo denunciás, te ganas enemigos pesados.",choices:[{title:"Denunciar en Fiscalía",desc:"Conferencia con pruebas",effects:{prestigio:15,reputacion:12,estabilidad:-12,influencia:-5,recursos:-5},headline:"Edil denuncia coima millonaria",tags:["prestigio","valiente"]},{title:"Aceptar y blanquear como donación",desc:"La vieja política",effects:{recursos:18,escandalos:18,reputacion:-15,estabilidad:-5},headline:"Sospechas de financiamiento",tags:["riesgo","aparato"]},{title:"Abstenerte y filtrar anónimo",desc:"Jugada de operador",effects:{influencia:6,prensa:5,estabilidad:3,reputacion:-3},headline:"Licitación bajo sospecha",tags:["operador"]}]},{age:28,id:"e28",type:"story",meta:"PARLAMENTO • PASANTÍA",title:"Te llaman de asesores del Senado",context:"Palacio Legislativo, piso 2. Aire acondicionado y rosca.",text:"Un senador veterano te quiere como asesor principal. Laburo de 12 horas, pero acceso directo a leyes y prensa. Te pide que defiendas una rebaja impositiva al agro que tu base odia.",choices:[{title:"Defender la rebaja con datos",desc:"Te volvés voz del interior",effects:{rural:12,prestigio:5,popularidad:-6,recursos:5},headline:"Giro al interior productivo",tags:["tecnico"]},{title:"Rechazar y proponer alternativa progresiva",desc:"Te la jugás contra tu jefe",effects:{sindicatos:10,popularidad:8,influencia:-8,estabilidad:-5},headline:"Choque en el bloque",tags:["populista"]},{title:"Operar en silencio para cajonear",desc:"Que no se vote nunca",effects:{influencia:10,experiencia:8,estabilidad:4},headline:"Proyecto encajonado",tags:["aparato"]}]},{age:30,id:"e30",type:"story",meta:"MEDIOS • CANAL 4",title:"Invitación a debate en TV",context:"Polémica en el Bar. Rating, luces, gritos.",text:"Te invitan a discutir seguridad. El tema quema. Si vas duro con mano dura, subís con votante mayor. Si vas garantista, te bancan las redes pero te matan en TV.",choices:[{title:"Mano dura, cárceles y LUC",desc:"Discurso Cabildo-friendly",effects:{popularidad:10,seguridad:5,prestigio:-5,sindicatos:-6},headline:"Pide más mano dura",tags:["populista","seguridad"]},{title:"Enfoque rehabilitación + datos",desc:"Citás cifras de Noruega",effects:{prestigio:10,prensa:6,popularidad:-4},headline:"Propuesta nórdica para cárceles",tags:["prestigio"]},{title:"Atacar al rival en vivo",desc:"Clip viral asegurado",effects:{popularidad:12,prensa:8,reputacion:-8,escandalos:5},headline:"Cruce feroz en TV",tags:["viral","riesgo"]}]},{age:32,id:"e32",type:"story",meta:"PARTIDO • INTERNA",title:"La lista al Parlamento se define a cuchillo",context:"Congreso en Durazno. Asado, vino, y traiciones.",text:"Tenés que negociar tu lugar en lista a Diputados por Montevideo. Hay 3 facciones. La oficialista te pide que bajes tu perfil en redes a cambio de lugar 4. La disidente te ofrece lugar 2 pero es suicidio si pierden.",choices:[{title:"Con oficialismo, perfil bajo",desc:"Seguro pero opaco",effects:{apoyo:12,org:8,popularidad:-4,estabilidad:5},headline:"Acuerdo de cúpulas",tags:["aparato"]},{title:"Con disidencia, a todo o nada",desc:"Si ganan, sos diputado seguro",effects:{popularidad:10,influencia:-5,estabilidad:-8,experiencia:6},headline:"Rebelión en la interna",tags:["populista","riesgo"]},{title:"Lista propia joven",desc:"Peligrosa pero te posiciona",effects:{prestigio:8,prensa:8,recursos:-8,apoyo:-5},headline:"Lista joven irrumpe",tags:["prestigio","renovador"]}]},{age:34,id:"e34",type:"story",meta:"DIPUTADO • PRIMER AÑO",title:"Proyecto de ley polémico",context:"Comisión de Hacienda. Empresarios en la puerta.",text:"Te toca informar una reforma de impuestos al patrimonio. Tu partido quiere subir 1 punto. aratónica por interior",tags:["populista","campaña"]},{title:"Campaña de ideas en universidades",desc:"Debates, papers, podcast",effects:{prestigio:12,prensa:8,popularidad:4},headline:"Senador con plan de país",tags:["prestigio"]},{title:"Pacto con intendentes",desc:"Ellos ponen estructura, vos promesas",effects:{influencia:14,org:10,recursos:6,reputacion:-6},headline:"Pacto con barones del interior",tags:["aparato"]}]},{age:40,id:"e40",type:"story",meta:"SENADOR • PODER REAL",title:"Te ofrecen presidir comisión clave",context:"Comisión de Constitución. Todo pasa por ahí.",text:"Como senador, podés presidir Presupuesto o Constitución. Presupuesto te da poder con intendentes. Constitución te da prestigio con abogados. Tu partido quiere que vayas a Presupuesto para negociar cargos.",choices:[{title:"Presupuesto: poder territorial",desc:"Manejás partidas",effects:{influencia:12,org:8,rural:8,prestigio:-3},headline:"Controla caja del Estado",tags:["aparato"]},{title:"Constitución: perfil jurídico",desc:"Te citan en Facultad",effects:{prestigio:12,reputacion:8,prensa:5},headline:"Jurista del Senado",tags:["prestigio"]},{title:"Negociar ambas y rotar",desc:"Operador máximo",effects:{experiencia:10,influencia:6,estabilidad:-4},headline:"Acumula comisiones",tags:["operador"]}]},{age:42,id:"e42",type:"story",meta:"GOBIERNO • COALICIÓN",title:"Te ofrecen subsecretaría",context:"Casa de Gobierno, despacho chico.",text:"El presidente te ofrece Subsecretaría de Industria. Dejás Senado (y fueros) por gestión. Si aceptás y hacés buena gestión, salto a ministro. Si te va mal, te comen.",choices:[{title:"Aceptar y gestionar",desc:"Dejar discurso por gestión",effects:{experiencia:12,prestigio:6,estabilidad:-6,popularidad:-2},headline:"Deja banca por Ejecutivo",tags:["gestion"]},{title:"Rechazar, quedarte en Senado",desc:"Seguridad de la banca",effects:{estabilidad:8,influencia:5,popularidad:3},headline:"Se queda en el Senado",tags:["aparato"]},{title:"Pedir ministerio o nada",desc:"All in",effects:{popularidad:8,prestigio:-4,estabilidad:-10,escandalos:3},headline:"Exige ministerio",tags:["populista","riesgo"]}]},{age:44,id:"e44",type:"story",meta:"CRISIS • 200 MIL EMPLEOS",title:"Crisis del agro, corte de rutas",context:"Productores cortan ruta 5. Supermercados vacíos.",text:"Paro agropecuario. La coalición se parte. Los tuyos te piden que salgas a bancar al gobierno aunque tu base te putee. Tu asesor de campaña dice que es momento de desmarcarte.",choices:[{title:"Bancar al gobierno a muerte",desc:"Cadena nacional improvisada",effects:{apoyo:10,estabilidad:6,popularidad:-8,rural:8},headline:"Defiende al gobierno en crisis",tags:["aparato"]},{title:"Desmarcarte y criticar",desc:"Perfil propio",effects:{popularidad:12,prestigio:4,apoyo:-10,estabilidad:-8},headline:"Ruptura en la coalición",tags:["populista"]},{title:"Mesa de diálogo",desc:"Propuesta de compromiso",effects:{prestigio:10,reputacion:6,influencia:4},headline:"Propone mesa de diálogo",tags:["prestigio"]}]},{age:46,id:"e46",type:"story",meta:"PRE-CANDIDATURA",title:"Tu nombre suena para presidente",context:"Encuesta Factum: 12% intención dentro del partido.",text:"Empezás a medir. Tenés que decidir si lanzás tu precandidatura ahora o esperás. Si lanzás temprano, te desgastás. Si esperás, otro ocupa el lugar.",choices:[{title:"Lanzar ya, acto en Las Piedras",desc:"Gran acto con chorizos",effects:{popularidad:10,recursos:-8,apoyo:6,estabilidad:-4},headline:"Lanza precandidatura",tags:["populista"]},{title:"Esperar y armar equipos",desc:"Plan de gobierno de 200 páginas",effects:{prestigio:10,experiencia:8,influencia:5},headline:"Prepara plan de gobierno",tags:["prestigio"]},{title:"Hacer acuerdo con otro precandidato",desc:"Ser vice",effects:{estabilidad:8,influencia:6,popularidad:-3},headline:"Acuerdo de fórmula",tags:["aparato"]}]},{age:48,id:"e48",type:"story",meta:"INTERNA • BALOTAJE INTERNO",title:"Debate interno televisado",context:'Canal 10, prime time. Tu rival te acusa de ser "casta".',text:"Estás en debate interno. Te acusan de haber votado una ley que benefició a UPM. Es verdad, pero también trajiste 2000 empleos. Tenés 2 minutos.",choices:[{title:"Defender UPM con empleo",desc:"Datos de empleo",effects:{empresarios:8,prestigio:5,popularidad:-4,sindicatos:4},headline:"Defiende inversión extranjera",tags:["tecnico"]},{title:'Atacar: "Vos nunca laburaste"',desc:"Golpe bajo efectivo",effects:{popularidad:12,prensa:6,reputacion:-10,escandalos:4},headline:"Debate subido de tono",tags:["viral"]},{title:"Propuesta superadora: Fondo del interior",desc:"Sacar tema de agenda",effects:{rural:10,prestigio:8,popularidad:5},headline:"Propone fondo para interior",tags:["prestigio"]}]},{age:50,id:"e50",type:"election",electionType:"president",meta:"ELECCIÓN • PRESIDENCIA",title:"La elección presidencial",context:"Balotaje obligatorio. 45% para ganar en primera.",text:"Tenés 50. La elección presidencial. Tu fórmula contra todo el sistema. Si llegás a 45% ganás en primera. Si no, balotaje. Todo lo que hiciste te trajo hasta acá.",choices:[{title:"Campaña épica, 19 departamentos otra vez",desc:"Cierre en Antel Arena",effects:{popularidad:16,recursos:-15,estabilidad:-6},headline:"Cierre multitudinario",tags:["populista","campaña"]},{title:"Campaña de centro, acuerdo con independientes",desc:"Buscar balotaje",effects:{prestigio:10,prensa:8,popularidad:6,sindicatos:4},headline:"Giro al centro",tags:["prestigio"]},{title:"Campaña de aparato, estructura pura",desc:"Cada comité una fortaleza",effects:{influencia:14,org:12,popularidad:4,recursos:6},headline:"Aparato a full",tags:["aparato"]}]},{age:52,id:"e52",type:"story",meta:"PRESIDENTE O SENADOR",title:"Primer año de gobierno / oposición",context:"Torre Ejecutiva o banca de oposición. Dos mundos.",text:"Si sos presidente, tenés 40% de aprobación y paros. Si sos senador opositor, tenés tribuna para pegarle al gobierno. En ambos casos, te piden reforma de seguridad social.",choices:[{title:"Impulsar reforma dur
